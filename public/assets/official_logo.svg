<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Circular White Background Badge -->
  <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#f1f5f9" stroke-width="4"/>
  
  <!-- Dual Petal Icon -->
  <g transform="translate(200, 160)">
    <!-- Right Petal (Rose Pink) -->
    <path fill="#d9777f" d="M 0 10 C 25 -35 85 -45 105 -10 C 120 15 100 65 55 75 C 20 83 -5 45 0 10 Z" />
    
    <!-- Left Petal (Dark Maroon) -->
    <path fill="#6b1d28" d="M -85 10 C -65 -35 5 -45 25 -10 C 40 15 20 65 -25 75 C -60 83 -90 45 -85 10 Z" />
  </g>
  
  <!-- School Name Text -->
  <text x="200" y="275" font-family="'Georgia', 'Times New Roman', serif" font-weight="bold" font-size="32" fill="#581c24" text-anchor="middle" letter-spacing="-0.5">
    Eshwar Vidyalaya
  </text>
  
  <!-- Subtitle Text -->
  <text x="200" y="305" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-size="19" fill="#581c24" text-anchor="middle">
    The School of Experience
  </text>
</svg>
